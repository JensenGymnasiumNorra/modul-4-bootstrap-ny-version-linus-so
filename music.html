<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body class="text-bg-secondary">
    <header id="navbar"></header>

    <main>
      <div id="carouselWithCaptions" class="carousel slide h-7" data-bs-ride="carousel">
        <ol class="carousel-indicators">
          <li data-bs-target="#carouselWithCaptions" data-bs-slide-to="0" class="active"></li>
          <li data-bs-target="#carouselWithCaptions" data-bs-slide-to="1"></li>
          <li data-bs-target="#carouselWithCaptions" data-bs-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="Mozart.png" class="d-block w-100" style="height: 500px;" alt="Slide 1">
            <div class="carousel-caption d-none d-sm-block">
              <h5>Eine Kleine Nachmusik</h5>
              <p>Fire låt</p>
            </div>
          </div>
          <div class="carousel-item">
            <img src="Bach.png" class="d-block w-100" style="height: 500px;" alt="Slide 2">
            <div class="carousel-caption d-none d-sm-block">
              <h5>Four Orchestral Suites</h5>
              <p>-</p>
            </div>
          </div>
          <div class="carousel-item">
            <img src="psy.png" class="d-block w-100" style="height: 500px;" alt="Slide 3">
            <div class="carousel-caption d-none d-sm-block">
              <h5>Gangnam Style</h5>
              <p>Woop Woop Woop</p>
            </div>
          </div>
        </div>
        <a class="carousel-control-prev" href="#carouselWithCaptions" role="button" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </a>
        <a class="carousel-control-next" href="#carouselWithCaptions" role="button" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </a>
      </div>
    </main>
    <section class="fixed-bottom" id="foot"></section>

  </body>


  <script src="navbar.js" defer></script>

  
  <script src="footer.js" defer></script>

  <script>
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>

  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</html>
